seed: 42
n_jobs: 4

# Input dataset: one row per offer made to a customer. "columns" maps the
# pipeline's roles to the CSV's column names.
dataset:
  name: mydata
  path: data/raw/mydata.csv
  columns:
    customer_key: customer_id_pseudo
    offer_date: offer_date
    action: offer_name
    accepted: target_accepted
    value: estimated_offer_value_usd   # reward for expected-value ranking, not a feature
    propensity: logged_propensity      # logging policy, for off-policy evaluation only
  categorical: [offer_channel, age_band, employment_type, income_band, region, balance_band]
  numeric: [contact_count, tenure_months, products_held_count, has_loan, has_card,
            txn_count_30d, txn_value_30d, salary_inflow_flag, mobile_logins_30d]
  # Deliberately not features: gender (protected attribute, kept for fairness
  # checks) and consent_marketing (an eligibility rule, constant in this data).
  protected: [gender]
  eligibility_column: consent_marketing

# method time: train on offers up to train_end, test on the rest (out-of-time).
# method random: seeded split stratified on the outcome, test_size of each offer.
split:
  method: time
  train_end: "2025-12-31"
  test_size: 0.2

# Model family: xgboost, random_forest or logistic_regression; hyperparameters
# are read from the section of the same name.
model:
  type: xgboost

# Reweight positives by negatives/positives. Off: weighting inflated the
# probabilities and the odds correction then under-predicted every action
# (experiments/calibration_comparison.py); expected-value ranking needs
# calibrated probabilities, and unweighted AUC was equal or better.
balance_classes: false

xgboost:
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  reg_lambda: 1.0
  tree_method: hist
  eval_metric: aucpr

random_forest:
  n_estimators: 300
  max_depth: 8
  min_samples_leaf: 5

logistic_regression:
  C: 1.0

# Grid search on the training data only: time-ordered folds for a time split,
# stratified folds for a random split. Off by default.
tuning:
  enabled: false
  cv_folds: 3
  scoring: average_precision
  grid:
    xgboost: {max_depth: [3, 4, 6], learning_rate: [0.03, 0.05, 0.1], n_estimators: [200, 400]}
    random_forest: {max_depth: [6, 8, 12], min_samples_leaf: [2, 5, 10]}
    logistic_regression: {C: [0.01, 0.1, 1.0, 10.0]}

reproducibility:
  tolerance: 1.0e-6

# Population Stability Index thresholds for drift monitoring.
monitoring:
  psi_warn: 0.1
  psi_alert: 0.25
  # Relative gap between observed and mean predicted acceptance per action in
  # the monitored window; PSI on features cannot see changes in response.
  calibration_gap_warn: 0.1
  calibration_gap_alert: 0.25
  # Reported but not used for the retrain decision: cumulative counters grow
  # over time by construction.
  expected_trend: [contact_count]

mlflow:
  experiment: nba
