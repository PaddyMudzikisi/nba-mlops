seed: 42
n_jobs: 4

# Input dataset: one row per offer made to a customer. "columns" maps the
# pipeline's roles to the CSV's column names.
dataset:
  path: data/raw/mydata.csv
  columns:
    customer_key: customer_id_pseudo
    offer_date: offer_date
    action: offer_name
    accepted: target_accepted
    value: estimated_offer_value_usd   # reward for expected-value ranking, not a feature
    propensity: logged_propensity      # logging policy, for off-policy evaluation only
  categorical: [offer_channel, age_band, employment_type, income_band, region, balance_band]
  numeric: [contact_count, tenure_months, products_held_count, has_loan, has_card,
            txn_count_30d, txn_value_30d, salary_inflow_flag, mobile_logins_30d]
  # Deliberately not features: gender (protected attribute, kept for fairness
  # checks) and consent_marketing (an eligibility rule, constant in this data).

# Out-of-time split: train on offers up to this date, test on the rest.
split:
  train_end: "2025-12-31"

xgboost:
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  reg_lambda: 1.0
  tree_method: hist
  eval_metric: aucpr

reproducibility:
  tolerance: 1.0e-6

mlflow:
  experiment: nba
