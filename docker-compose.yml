name: nba-mlops

services:
  mlflow:
    image: nba-mlops:0.3.0
    build: .
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0 --port 5000
    ports:
      - "127.0.0.1:5001:5000"   # localhost only; macOS AirPlay Receiver holds port 5000
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-off jobs: docker compose run --rm app <command>
  app:
    image: nba-mlops:0.3.0
    profiles: ["job"]
    working_dir: /app
    volumes:
      - .:/app
      - ${HOME}/nba-mlops-dvcstore:/dvcstore
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      IMAGE_ID: ${IMAGE_ID:-unknown}
    depends_on:
      mlflow:
        condition: service_healthy

  # Scoring API: make serve RUN_ID=<parent run id>
  api:
    image: nba-mlops:0.3.0
    profiles: ["serve", "portal"]
    working_dir: /app
    command: uvicorn --factory nba.serve:from_env --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"   # localhost only
    volumes:
      - .:/app
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SERVE_RUN_ID: ${SERVE_RUN_ID:-}
      DECISION_LOG: /app/logs/decisions.jsonl
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy

  # Portal (upload, explore, train, validate, deploy): make portal
  portal:
    image: nba-mlops:0.3.0
    profiles: ["portal"]
    working_dir: /app
    command: streamlit run src/nba/portal/Home.py --server.address 0.0.0.0 --server.port 8501 --server.headless true --browser.gatherUsageStats false --server.maxUploadSize 500
    ports:
      - "127.0.0.1:8501:8501"   # localhost only
    volumes:
      - .:/app
      - ${HOME}/nba-mlops-dvcstore:/dvcstore
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      IMAGE_ID: ${IMAGE_ID:-unknown}
      API_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  mlflow-data:
